<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<title>Ôn thi HĐH Mạng</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#1d2129;--mut:#667085;--line:#e1e5ea;--acc:#2f5bea;--accbg:#e8eefe;--ok:#13804b;--okbg:#e5f6ec;--bad:#c4302b;--badbg:#fdeceb;--adv:#9a5b00;--advbg:#fff3df}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1c1f25;--fg:#e8eaed;--mut:#9aa3ae;--line:#2c3138;--acc:#7b9bff;--accbg:#1f2a48;--ok:#5fd394;--okbg:#14301f;--bad:#ff8079;--badbg:#3a1d1c;--adv:#ffc266;--advbg:#3a2c12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.45rem;margin:6px 0 2px}
h2{font-size:1rem;margin:22px 0 8px;color:var(--mut);font-weight:600}
.mut{color:var(--mut);font-size:.88rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;text-align:left;font-weight:600}
.seg button small{display:block;font-weight:400;color:var(--mut);font-size:.78rem}
.seg button.on{border-color:var(--acc);background:var(--accbg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;min-height:64px}
.card:active{background:var(--accbg)}
.card b{display:block;font-size:.95rem}
.card small{display:block;color:var(--mut);font-size:.78rem;margin-top:2px}
.card small.prog{color:var(--acc);font-weight:600}
.card small.done{color:var(--ok);font-weight:600}
/* exam */
:root{--tp:calc(8px + env(safe-area-inset-top,0px));--tt:0px}
.top{position:sticky;top:var(--tt);z-index:5;background:var(--bg);padding:var(--tp) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top .r{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto}
.top .ttl{flex:1;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:40px}
.pb{height:4px;background:var(--line);margin:8px calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.pb i{display:block;height:100%;background:var(--acc);transition:width .2s}
.qwrap{max-width:720px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px))}
.qn{font-size:.85rem;color:var(--mut);margin-bottom:6px}
.tag{font-size:.72rem;padding:1px 7px;border-radius:5px;background:var(--advbg);color:var(--adv);margin-left:6px;font-weight:700}
.qt{font-size:1.06rem;font-weight:600;margin-bottom:14px;line-height:1.5}
.o{display:flex;gap:10px;width:100%;text-align:left;padding:13px 12px;margin-bottom:9px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:52px;align-items:flex-start}
.o .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mut);margin-top:1px}
.o:active{background:var(--accbg)}
.o.sel{border-color:var(--acc);background:var(--accbg)}.o.sel .l{background:var(--acc);color:#fff;border-color:var(--acc)}
.o.ok{border-color:var(--ok);background:var(--okbg)}.o.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.o.bad{border-color:var(--bad);background:var(--badbg)}.o.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.o:disabled{opacity:1;cursor:default}
.fb{margin-top:6px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:.93rem}
.fb .rok{color:var(--ok);font-weight:700}.fb .rbad{color:var(--bad);font-weight:700}
.bot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bot .r{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:720px;margin:0 auto}
.nb{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px;font-weight:600;min-height:50px}
.nb.p{background:var(--acc);border-color:var(--acc);color:#fff}
.nb:disabled{opacity:.4}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:86dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:1.05rem}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:10px 0}
.nums button{height:44px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-weight:600;font-size:.9rem}
.nums button.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.nums button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.nums button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.nums button.cur{outline:3px solid var(--adv);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .nb{flex:1;min-width:130px}
.score{font-size:2.2rem;font-weight:800;margin:4px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"exams": [{"id": "c1e1", "group": "Chương 1 – Giới thiệu", "name": "Chương 1 – Đề 1", "qs": [{"q": "HĐH nào sau đây KHÔNG thuộc nhóm Unix trong danh sách HĐH mạng của bài giảng?", "o": ["BSD Unix", "Oracle Solaris", "Debian Linux", "HP Unix"], "a": 2, "adv": false, "e": "Debian thuộc nhóm Linux."}, {"q": "Điều nào KHÔNG phải là nhược điểm của mô hình client/server theo bài giảng?", "o": ["Đắt tiền", "Bảo trì đòi hỏi nhân viên trình độ", "Khó đảm bảo an toàn mạng", "Phụ thuộc vào máy chủ"], "a": 2, "adv": false, "e": "Khó đảm bảo an toàn là nhược điểm của P2P."}, {"q": "Cân bằng tải (load balancing) giữa các máy chủ trong chuỗi nhằm mục đích gì?", "o": ["Giảm số máy chủ xuống một", "Tắt các máy chủ không dùng", "Mã hóa dữ liệu", "Phân phối yêu cầu đều để tăng hiệu năng và tính sẵn dùng"], "a": 3, "adv": false, "e": "Cân bằng tải chia đều tải giữa các máy."}, {"q": "Theo bài giảng, mục \"Chuỗi máy chủ cân bằng tải\" và \"Quản lý cân bằng tải\" thuộc nhóm dịch vụ nào?", "o": ["Dịch vụ Web", "Quản trị người dùng", "Dịch vụ email", "Quản trị mạng"], "a": 3, "adv": false, "e": "Các hình này thuộc phần Quản trị mạng."}, {"q": "Các HĐH mạng chuyên dụng JUNOS và Cisco IOS được sử dụng trên loại thiết bị nào?", "o": ["Máy in", "Điện thoại di động", "Máy tính bảng", "Router và switch"], "a": 3, "adv": false, "e": "Chúng chạy trên router và switch."}, {"q": "Hai thành phần điểm nào có trọng số bằng nhau (cùng 10%)?", "o": ["Chuyên cần và kiểm tra", "Kiểm tra và thi cuối kỳ", "Chuyên cần và bài tập/thực hành", "Bài tập/thực hành và kiểm tra"], "a": 2, "adv": false, "e": "Chuyên cần và bài tập/thực hành đều 10%."}, {"q": "HĐH mạng peer-to-peer cho phép người dùng làm gì?", "o": ["Chỉ truy nhập tài nguyên trên máy chủ chuyên dụng", "Chỉ sử dụng tài nguyên cục bộ, không chia sẻ", "Chỉ quản trị máy chủ file", "Chia sẻ tài nguyên trên máy của mình và truy nhập tài nguyên chia sẻ trên máy khác"], "a": 3, "adv": false, "e": "P2P cho phép vừa chia sẻ vừa truy nhập tài nguyên của nhau."}, {"q": "Lưu trữ file phân tán được giới thiệu trong chương 1 sẽ được trình bày chi tiết ở chương nào?", "o": ["Chương 3", "Chương 5", "Chương 6", "Chương 2 - Hệ thống file phân tán"], "a": 3, "adv": false, "e": "Hệ thống file phân tán là chương 2."}, {"q": "Bài giảng minh họa Secure Shell trên HĐH nào?", "o": ["Windows Server", "Cisco IOS", "RedHat", "Solaris"], "a": 2, "adv": false, "e": "Có hình minh họa Secure Shell (RedHat)."}, {"q": "Ubuntu được phát triển dựa trên bản phân phối Linux nào?", "o": ["RedHat Linux", "Debian Linux", "SUSE Linux", "Fedora Core"], "a": 1, "adv": false, "e": "Bài giảng ghi Ubuntu dựa trên Debian Linux."}, {"q": "Phát biểu nào đúng về iOS và Android theo phân loại trong bài giảng?", "o": ["Cả hai đều đơn nhiệm", "iOS được xếp đơn nhiệm, Android được xếp đa nhiệm", "Cả hai đều đa nhiệm", "iOS đa nhiệm, Android đơn nhiệm"], "a": 1, "adv": false, "e": "Bài giảng xếp iOS đơn nhiệm, Android đa nhiệm."}, {"q": "Theo định nghĩa trong bài giảng, NOS cung cấp các chức năng quản trị hệ thống bao gồm cả vấn đề gì?", "o": ["Thiết kế đồ họa", "Xử lý âm thanh", "Soạn thảo văn bản", "An ninh an toàn"], "a": 3, "adv": false, "e": "Quản trị hệ thống của NOS bao gồm an ninh an toàn."}, {"q": "Phiên bản nào sau đây thuộc dòng RedHat Enterprise được nêu trong bài giảng?", "o": ["RedHat Enterprise 24", "RedHat Enterprise 2016", "RedHat Enterprise 6", "RedHat Enterprise XP"], "a": 2, "adv": false, "e": "Bài giảng liệt kê RedHat Enterprise 3, 4, 5, 6."}, {"q": "Oracle Solaris thuộc dòng HĐH mạng nào trong bài giảng?", "o": ["Unix", "Linux", "Microsoft Windows Servers", "HĐH thiết bị mạng"], "a": 0, "adv": false, "e": "Solaris được liệt kê trong nhóm Unix."}, {"q": "Thuật ngữ \"replication\" trong các chức năng của NOS được dịch là gì?", "o": ["Sao lưu", "Định tuyến", "Tạo bản thứ cấp", "Cân bằng tải"], "a": 2, "adv": false, "e": "Replication là tạo bản thứ cấp."}, {"q": "IIS là máy chủ web của hãng nào?", "o": ["Apache Software Foundation", "NGINX, Inc.", "Microsoft", "Cloudflare"], "a": 2, "adv": false, "e": "IIS (Internet Information Services) của Microsoft."}, {"q": "Một HĐH có thể vừa là single-user vừa là đa nhiệm không, theo các ví dụ trong bài giảng?", "o": ["Không, single-user luôn là đơn nhiệm", "Có, ví dụ Windows 10", "Chỉ có trên Unix", "Chỉ có trên MS-DOS"], "a": 1, "adv": false, "e": "Windows 95-11 là single-user nhưng đa nhiệm."}, {"q": "Chức năng nào sau đây KHÔNG thuộc nhóm tính năng đảm bảo an toàn của NOS?", "o": ["Xác thực", "Định tuyến (routing)", "Trao quyền", "Hạn chế đăng nhập"], "a": 1, "adv": false, "e": "Routing thuộc nhóm tính năng liên mạng."}, {"q": "Theo bài giảng, đến tháng 6/2016 Fedora đã có phiên bản số mấy?", "o": ["9", "7", "6", "24"], "a": 3, "adv": false, "e": "Bài giảng ghi Fedora Core 1,..., 24 (6.2016)."}, {"q": "Theo bài giảng, truy nhập từ xa được chia thành những dạng nào?", "o": ["Truy nhập có dây và không dây", "Điều khiển từ xa (remote control) và truy nhập từ xa (remote access)", "Truy nhập đọc và ghi", "Truy nhập nội bộ và Internet"], "a": 1, "adv": false, "e": "Hai dạng: remote control và remote access."}, {"q": "Nhóm nào sau đây toàn là HĐH multi-user theo bài giảng?", "o": ["MS-DOS, PC-DOS, Windows 95", "Windows XP, Vista, Windows 7", "iOS, MS-DOS, Windows ME", "Windows Server 2022, Linux OS servers, Unix OS servers"], "a": 3, "adv": false, "e": "Các HĐH máy chủ Windows, Linux, Unix đều multi-user."}, {"q": "Chức năng \"Disk and file systems\" của HĐH là gì?", "o": ["Quản lý đĩa và hệ thống file", "Quản lý tiến trình", "Giao tiếp mạng", "Trình điều khiển thiết bị"], "a": 0, "adv": false, "e": "Đây là quản lý đĩa và hệ thống files."}, {"q": "HĐH đơn nhiệm (single-task) có đặc điểm gì?", "o": ["Chỉ hỗ trợ chạy một ứng dụng tại một thời điểm", "Cho phép nhiều người dùng đăng nhập đồng thời", "Chạy nhiều ứng dụng đồng thời", "Chuyên cung cấp dịch vụ mạng"], "a": 0, "adv": false, "e": "Đơn nhiệm chỉ chạy một ứng dụng tại một thời điểm."}, {"q": "Mục \"Các dị 7 ms", "12 ms", "7 ms"], "a": 3, "adv": false, "e": "p = (T1 − T0 − h)/2 = (24 − 10)/2 = 7 ms."}, {"q": "Điều nào KHÔNG đúng về đồng hồ logic?", "o": ["Đồng hồ logic phải khớp với thời gian UTC", "Đồng hồ logic dùng bộ đếm phần mềm", "Mỗi tiến trình có bộ đếm riêng", "Đồng hồ logic thể hiện quan hệ nhân quả"], "a": 0, "adv": false, "e": "Đồng hồ logic không cần khớp UTC."}, {"q": "Giải thuật Cristian: client gửi yêu cầu lúc T0 = 300 ms, nhận phản hồi lúc T1 = 320 ms, thời gian xử lý tại server h = 2 ms, server trả về UTC = 2145 ms. Client đặt đồng hồ thành?", "o": ["2154 ms", "2165 ms", "2155 ms", "2136 ms"], "a": 0, "adv": false, "e": "p = (320 − 300 − 2)/2 = 9 ms, nên đồng hồ = 2145 + 9 = 2154 ms."}, {"q": "Giải thuật Berkeley (bỏ qua round-trip): so với master, slave S1 lệch -11 giây, slave S2 lệch +10 giây, slave S3 lệch +29 giây. Master gửi lượng hiệu chỉnh nào cho S3?", "o": ["-22 giây", "+22 giây", "-7 giây", "+7 giây"], "a": 0, "adv": false, "e": "Trung bình (gồm master = 0) là 7; hiệu chỉnh S3 = 7 − (29) = -22 giây."}, {"q": "Theo bài giảng, nguồn UTC có xuất xứ gắn với quốc gia nào?", "o": ["Ấn Độ", "Pháp", "Nhật Bản", "Brazil"], "a": 1, "adv": false, "e": "Bài giảng ghi UTC (from France)."}, {"q": "Đồng hồ phần cứng và đồng hồ phần mềm khác nhau thế nào?", "o": ["Đồng hồ phần mềm không phụ thuộc phần cứng", "Đồng hồ phần mềm được cập nhật từ thanh ghi đếm của đồng hồ phần cứng qua ngắt", "Đồng hồ phần cứng do hệ điều hành tính toán", "Hai loại là một"], "a": 1, "adv": false, "e": "Trình xử lý ngắt chuyển giá trị đếm phần cứng thành đồng hồ phần mềm."}, {"q": "Nếu hệ có máy thu UTC gắn tại server S, giải thuật nào phù hợp để các client trong Intranet đồng bộ với S?", "o": ["Cristian", "Vector clock", "Lamport", "Berkeley thuần túy"], "a": 0, "adv": false, "e": "Client hỏi S để lấy UTC: Cristian."}, {"q": "Sự kiện a có vector clock (3,1,2), sự kiện b có vector clock (1,3,2). Quan hệ giữa a và b là?", "o": ["a → b", "a và b đồng thời", "b → a", "a và b là cù đối xứng → đặt giờ", "Server thăm dò client → tính trung bình → gửi hiệu chỉnh", "Client gửi yêu cầu (T0) → server trả UTC → client nhận (T1) → tính p → đặt UTC + p", "Client đặt giờ → gửi yêu cầu → tính p"], "a": 2, "adv": false, "e": "Đúng trình tự Cristian."}, {"q": "Nếu trong hệ thống đồng bộ MAX = MIN thì độ lệch lớn nhất sau đồng bộ là bao nhiêu?", "o": ["MAX", "Không xác định", "0", "MAX/2"], "a": 2, "adv": false, "e": "(MAX − MIN)/2 = 0 khi MAX = MIN."}, {"q": "Vì sao trong nhiều trường hợp chỉ cần thời gian logic?", "o": ["Vì đồng hồ vật lý luôn hỏng", "Vì NTP cấm dùng ở LAN", "Vì UTC không tồn tại trong hệ phân tán", "Vì chỉ cần thống nhất về thời gian trong hệ thống, không nhất thiết là UTC"], "a": 3, "adv": false, "e": "Thường chỉ cần thống nhất nội bộ, không cần UTC."}, {"q": "Sự kiện a có vector clock (0,5,5), sự kiện b có vector clock (1,4,2). Quan hệ giữa a và b là?", "o": ["b → a", "a → b", "a và b đồng thời", "a và b là cùng một sự kiện"], "a": 2, "adv": false, "e": "So sánh từng thành phần: mỗi vector có thành phần lớn hơn nên không so sánh được, a ∥ b."}, {"q": "Phát biểu nào đúng về đồng bộ nội bộ?", "o": ["Đồng bộ nội bộ chỉ áp dụng cho một máy", "Các đồng hồ có thể cùng lệch khỏi UTC nhưng vẫn đồng bộ nội bộ", "Đồng bộ nội bộ bắt buộc mọi đồng hồ khớp UTC", "Đồng bộ nội bộ không cần trao đổi thông điệp"], "a": 1, "adv": false, "e": "Đồng bộ nội bộ chỉ ràng buộc chênh lệch giữa các đồng hồ, không so với UTC."}, {"q": "Hai đồng hồ lệch với tần suất R = 0,05 ms/giây, sai số cho phép D = 8 ms. Chu kỳ đồng bộ hóa tối đa là bao nhiêu?", "o": ["40 giây", "0,8 giây", "160 giây", "80 giây"], "a": 3, "adv": false, "e": "Chu kỳ = D/2R = 8/(2×0,05) = 80 giây."}, {"q": "Máy A chạy nhanh hơn UTC 4 giây. Theo bài giảng, đây là hiện tượng gì?", "o": ["Quan hệ đồng thời", "Đồng hồ lệch giờ giữa hai máy", "Đồng hồ sai giờ", "Đồng bộ nội bộ"], "a": 2, "adv": false, "e": "So với đồng hồ chuẩn thì gọi là sai giờ."}, {"q": "Sự kiện a có vector clock (4,4,2), sự kiện b có vector clock (4,3,3). Quan hệ giữa a và b là?", "o": ["b → a", "a và b là cùng một sự kiện", "a → b", "a và b đồng thời"], "a": 3, "adv": false, "e": "So sánh từng thành phần: mỗi vector có thành phần lớn hơn nên không so sánh được, a ∥ b."}, {"q": "Phát biểu nào đúng về điều kiện đồng hồ Lamport?", "o": ["a → b suy ra T(a) < T(b), nhưng T(a) < T(b) không suy ra a → b", "a → b suy ra T(a) > T(b)", "T(a) < T(b) luôn suy ra a → b", "T(a) = T(b) suy ra a → b"], "a": 0, "adv": false, "e": "Lamport chỉ đảm bảo chiều a → b ⇒ T(a) < T(b)."}, {"q": "[Nâng cao] Trao đổi kiểu NTP/Cristian: client gửi lúc T1 = 1000, server nhận lúc T2 = 1050, server gửi lúc T3 = 1060, client nhận lúc T4 = 1030 (ms). Độ lệch (offset) và độ trễ khứ hồi (delay) là?", "o": ["offset = 20 ms, delay = 10 ms", "offset = -40 ms, delay = 20 ms", "offset = 40 ms, delay = 20 ms", "offset = 40 ms, delay = 30 ms"], "a": 2, "adv": true, "e": "offset = ((T2−T1)+(T3−T4))/2 = 40; delay = (T4−T1)−(T3−T2) = 20."}, {"q": "Hai đồng hồ vừa được đồng bộ, mỗi đồng hồ lệch với tần suất tối đa 0,5 ms/giây. Sau 300 giây, sai khác lớn nhất có thể giữa chúng là?", "o": ["300 ms", "75 ms", "150 ms", "600 ms"], "a": 0, "adv": false, "e": "Sai khác tối đa = 2R × t = 2 × 0,5 × 300 = 300 ms."}, {"q": "Trong đồng bộ Lamport, khi gửi thông điệp, tem gắn vào thông điệp là?", "o": ["Giá trị của bên nhận", "Giá trị UTC", "Giá trị 0", "Giá trị đồng hồ của sự kiện gửi"], "a": 3, "adv": false, "e": "Thông điệp mang tem của sự kiện gửi."}, {"q": "Sắp xếp các chế độ NTP theo độ chính xác tăng dần?", "o": ["Multicast → Đối xứng → Gọi thủ tục", "Multicast → Gọi thủ tục → Đối xứng", "Đối xứng → Gọi thủ tục → Multicast", "Gọi thủ tục → Multicast → Đối xứng"], "a": 1, "adv": false, "e": "Multicast kém nhất, symmetric cao nhất."}, {"q": "Giải thuật Cristian: client gửi yêu cầu lúc T0 = 150 ms, nhận phản hồi lúc T1 = 256 ms, thời gian xử lý tại server h = 86 ms, server trả về UTC = 6465 ms. Client đặt đồng hồ thành?", "o": ["6455 ms", "6475 ms", "6518 ms", "6571 ms"], "a": 1, "adv": false, "e": "p = (256 − 150 − 86)/2 = 10 ms, nên đồng hồ = 6465 + 10 = 6475 ms."}, {"q": "Trong hệ thống đồng bộ có độ trễ thông điệp MIN = 15 ms, MAX = 43 ms. Tiến trình 1 gửi thời gian t = 860 ms cho tiến trình 2. Tiến trình 2 nên đặt đồng hồ bằng?", "o": ["875 ms", "903 ms", "889 ms", "874 ms"], "a": 2, "adv": false, "e": "t + (MAX + MIN)/2 = 860 + 29 = 889 ms."}, {"q": "Nhược điểm nào của giải thuật Cristian được bài giảng nêu?", "o": ["Cần bầu chọn master liên tục", "Không dùng được thời gian UTC", "Không thể đo round-trip", "Server có thể là nút yếu nhất trong hệ thống"], "a": 3, "adv": false, "e": "Server thời gian duy nhất có thể là điểm yếu nhất."}, {"q": "Giải thuật Cristian: client gửi yêu cầu lúc T0 = 180 ms, nhận phản hồi lúc T1 = 274 ms, thời gian xử lý tại server h = 12 ms, server trả về UTC = 4760 ms. Client đặt đồng hồ thành?", "o": ["4854 ms", "4801 ms", "4807 ms", "4719 ms"], "a": 1, "adv": false, "e": "p = (274 − 180 − 12)/2 = 41 ms, nên đồng hồ = 4760 + 41 = 4801 ms."}, {"q": "Trong cơ chế đồng hồ phần cứng, số dao động của tinh thể thạch anh được lưu ở đâu?", "o": ["Trong bộ nhớ ROM BIOS cố định", "Trong bảng định tuyến", "Trong một thanh ghi đếm", "Trong bảng trang"], "a": 2, "adv": false, "e": "Số dao động được lưu trong một thanh ghi đếm."}, {"q": "Quan hệ \"xảy ra trước\" (→) có tính chất nào?", "o": ["Bắc cầu: a → b và b → c thì a → c", "Phản xạ: a → a", "Đối xứng: a → b thì b → a", "Không có tính chất nào"], "a": 0, "adv": false, "e": "Quan hệ happened-before có tính bắc cầu."}, {"q": "Điều nào KHÔNG đúng về giải thuật Cristian?", "o": ["Master tính trung bình đồng hồ của các slave", "Client đo T0 và T1", "Client đặt đồng hồ = UTC + p", "p = (T1 − T0 − h)/2"], "a": 0, "adv": false, "e": "Tính trung bình là của Berkeley."}, {"q": "Trong hệ thống đồng bộ, độ lệch lớn nhất giữa đồng hồ hai tiến trình sau khi hiệu chỉnh là?", "o": ["(MAX − MIN)/2", "MAX", "(MAX + MIN)/2", "MAX − MIN"], "a": 0, "a y mỗi giây"], "a": 1, "adv": false, "e": "Độ trôi 10⁻⁶ ứng với 1 μs/giây."}, {"q": "Một đồng hồ có độ trôi 10 × 10⁻⁶ (giây/giây). Sau 48 giờ không đồng bộ, đồng hồ có thể lệch tối đa bao nhiêu so với chuẩn?", "o": ["864 ms", "1728 ms", "172,8 ms", "17280 ms"], "a": 1, "adv": false, "e": "10×10⁻⁶ × 172800 s = 1728 ms."}, {"q": "Chương 4 của môn Hệ điều hành mạng gồm ba nội dung chính nào?", "o": ["Tiến trình, luồng, lập lịch CPU", "Hệ thống file phân tán, bộ nhớ ảo, RPC", "Bảo mật, xác thực, mã hóa", "Dịch vụ thời gian, các giải thuật đồng bộ hóa thời gian, thời gian và đồng hồ logic"], "a": 3, "adv": false, "e": "Chương 4 gồm 4.1 Dịch vụ thời gian, 4.2 Giải thuật đồng bộ, 4.3 Thời gian logic."}, {"q": "Hai đồng hồ lệch với tần suất R = 0,01 ms/giây, sai số cho phép D = 10 ms. Chu kỳ đồng bộ hóa tối đa là bao nhiêu?", "o": ["1000 giây", "500 giây", "0,2 giây", "250 giây"], "a": 1, "adv": false, "e": "Chu kỳ = D/2R = 10/(2×0,01) = 500 giây."}, {"q": "Sự kiện \"make\" biên dịch lại file sai do đồng hồ các máy lệch nhau minh họa điều gì?", "o": ["NTP không cần thiết", "Lamport chậm hơn vector clock", "Sự cần thiết của đồng bộ thời gian trong hệ phân tán", "Ưu điểm của đồng hồ lệch giờ"], "a": 2, "adv": false, "e": "Đồng hồ lệch gây quyết định sai dựa trên tem thời gian file."}, {"q": "Trong giải thuật Cristian với T0 = 272 ms, T1 = 434 ms và h = 86 ms, thời gian truyền thông điệp ước lượng p bằng bao nhiêu?", "o": ["38 ms", "124 ms", "81 ms", "76 ms"], "a": 0, "adv": false, "e": "p = (T1 − T0 − h)/2 = (162 − 86)/2 = 38 ms."}, {"q": "Master trong giải thuật Berkeley ước lượng thời gian cục bộ của slave dựa trên gì?", "o": ["Thời gian round-trip", "Tín hiệu GPS", "Số hiệu tiến trình", "Tem thời gian vector"], "a": 0, "adv": false, "e": "Master ước lượng thời gian slave dựa trên round-trip."}, {"q": "Thời gian logic biểu diễn quan hệ gì?", "o": ["Quan hệ chủ - tớ giữa máy", "Quan hệ thời gian thực UTC", "Quan hệ nhân - quả giữa các sự kiện", "Quan hệ cha - con giữa tiến trình"], "a": 2, "adv": false, "e": "Thời gian logic biểu diễn quan hệ nhân - quả."}, {"q": "Tertiary servers trong NTP đồng bộ với ai?", "o": ["Trực tiếp UTC", "Secondary servers", "Các client", "Primary servers"], "a": 1, "adv": false, "e": "Tertiary đồng bộ với secondary."}, {"q": "Hệ thống đồng bộ có MIN = 21 ms và MAX = 65 ms. Độ lệch lớn nhất giữa đồng hồ hai tiến trình sau khi hiệu chỉnh theo t + (MAX + MIN)/2 là?", "o": ["65 ms", "22 ms", "44 ms", "43 ms"], "a": 1, "adv": false, "e": "(MAX − MIN)/2 = (65 − 21)/2 = 22 ms."}]}, {"id": "c4e3", "group": "Chương 4 – Thời gian & đồng bộ hóa", "name": "Chương 4 – Đề 3", "qs": [{"q": "Chế độ gọi thủ tục của NTP thường được dùng khi nào?", "o": ["Chỉ trong LAN tốc độ cao", "Khi cần độ chính xác cao hơn hoặc nơi không có multicast", "Chỉ giữa các master", "Khi không cần độ chính xác"], "a": 1, "adv": false, "e": "Dùng để có độ chính xác cao hơn hoặc nơi không có multicast."}, {"q": "Tiến trình P2 (hệ 3 tiến trình) có vector clock (6,0,3), nhận thông điệp kèm vector (0,5,2). Vector clock của P2 sau sự kiện nhận là?", "o": ["(6,6,3)", "(0,6,2)", "(6,5,5)", "(6,5,3)"], "a": 0, "adv": false, "e": "Lấy max từng thành phần được (6,5,3), rồi tăng thành phần thứ 2: (6,6,3)."}, {"q": "Điều nào sau đây là một lý do cần dịch vụ thời gian trong hệ phân tán?", "o": ["Đo độ trễ giữa các thành phần phân tán", "Thay thế hoàn toàn cơ chế ngắt phần cứng", "Giảm số lượng tiến trình chạy song song", "Tăng dung lượng bộ nhớ chính"], "a": 0, "adv": false, "e": "Bài giảng nêu đo độ trễ giữa các thành phần phân tán là một nhu cầu dùng dịch vụ thời gian."}, {"q": "Giải thuật Cristian: client gửi yêu cầu lúc T0 = 880 ms, nhận phản hồi lúc T1 = 994 ms, thời gian xử lý tại server h = 4 ms, server trả về UTC = 4845 ms. Client đặt đồng hồ thành?", "o": ["4790 ms", "4902 ms", "4900 ms", "4959 ms"], "a": 2, "adv": false, "e": "p = (994 − 880 − 4)/2 = 55 ms, nên đồng hồ = 4845 + 55 = 4900 ms."}, {"q": "[Nâng cao] Berkeley: master đọc được độ lệch các slave so với mình (đã bù round-trip) là S1: +10 ms, S2: -20 ms, S3: +25 ms, S4: +300 ms. Giá trị lệch quá 50 ms bị loại. Lượng hiệu chỉnh gửi cho S2 là?", "o": ["-23,75 ms", "83 ms", "23,75 ms", "3,75 ms"], "a": 2, "adv": true, "e": "Trung bình các giá trị hợp lệ (gồm master 0): 3,75 ms; hiệu chỉnh = 3,75 − (-20) = 23,75 ms."}, {"q": "Càng xa primary server (tầng thấp hơn), độ chính xác thời gian thường?", "o": ["Luôn tuyệt đối", "Giảm dần", "Tăng dần", "Không đổi"], "a": 1, "adv": false, "e": "Mỗi tầng thêm sai số nên càng xa nguồn càng kém chính xác."}, {"q": "Hạn chế chính của đồng hồ Lamport là gì?", "o": ["Cần máy chủ UTC", "Không phát hiện được hai sự kiện đồng thời chỉ từ tem thời gian", "Không gán được tem cho thông điệp", "Bộ đếm có thể giảm"], "a": 1, "adv": false, "e": "Từ T(a) < T(b) không suy ra được a → b."}, {"q": "Việc cung cấp tem thời gian chính xác có vai trò gì theo bài giảng?", "o": ["Nén dữ liệu trước khi truyền", "Cấp phát địa chỉ IP động", "Mã hóa nội dung thông điệp", "Xác thực các giao dịch và đồng bộ hóa CSDL phân tán"], "a": 3, "adv": false, "e": "Tem thời gian chính xác dùng cho xác thực giao dịch, đồng bộ hóa CSDL phân tán."}, {"q": "Hai sự kiện a và b được gọi là đồng thời (concurrent) khi nào?", "o": ["Chúng xảy ra trên cùng tiến trình", "T(a) = T(b) theo Lamport", "Không có a → b và cũng không có b → a", "a gửi thông điệp tới b"], "a": 2, "adv": false, "e": "Đồng thời khi không có quan hệ xảy ra trước theo cả hai chiều."}, {"q": "Theo bài giảng, NTP gồm những gì?", "o": ["Một master và nhiều slave trong LAN", "Nhiều máy chủ NTP trên mạng Internet", "Một máy chủ duy nhất", "Chỉ các tiến trình logic"], "a": 1, "adv": false, "e": "NTP gồm nhiều máy chủ NTP trên Internet."}, {"q": "Vì sao chu kỳ đồng bộ trong bài giảng là D/2R chứ không phải D/R?", "o": ["Vì hai đồng hồ có thể lệch ngược chiều nhau, mỗi giây sai khác tăng 2R", "Vì thông điệp đi hai chiều", "Vì có hai máy chủ NTP", "Vì D luôn gấp đôi R"], "a": 0, "adv": false, "e": "Hai đồ ch", "Một sản phẩm của Citrix", "Một sản phẩm của Microsoft"], "a": 1, "adv": false, "e": "Qemu được nêu độc lập."}, {"q": "Ảo hóa toàn phần (Full virtualization) có đặc điểm gì?", "o": ["Hệ điều hành khách chạy không cần sửa đổi", "Chỉ ảo hóa ứng dụng", "Không cần hypervisor", "Hệ điều hành khách phải được sửa đổi để gọi hypervisor"], "a": 0, "adv": false, "e": "Full virtualization: guest OS không cần sửa."}, {"q": "Một ứng dụng cần dongle bản quyền USB đặc thù và card đo lường chuyên dụng. Theo bài giảng, đây là trường hợp nào?", "o": ["Trường hợp của Server Consolidation", "Ảo hóa có thể không hoạt động tốt do yêu cầu phần cứng chỉ định", "Trường hợp nên dùng VMWare Fusion", "Trường hợp lý tưởng để ảo hóa"], "a": 1, "adv": false, "e": "Yêu cầu phần cứng chỉ định là hạn chế của ảo hóa."}, {"q": "Giả lập (emulation) khác ảo hóa ở điểm cơ bản nào?", "o": ["Giả lập luôn nhanh hơn ảo hóa", "Không có khác biệt", "Giả lập mô phỏng cả tập lệnh CPU khác nên chậm hơn; ảo hóa chạy trực tiếp lệnh trên CPU cùng kiến trúc", "Ảo hóa có thể chạy CPU kiến trúc bất kỳ"], "a": 2, "adv": false, "e": "Emulation dịch tập lệnh khác, ảo hóa chạy native."}, {"q": "Theo bài giảng, kiến trúc phần cứng/tính năng nào có thể KHÔNG ảo hóa được?", "o": ["Card mạng Ethernet phổ biến", "Ổ đĩa cứng thông thường", "Đồng hồ, thời gian và các hành vi theo thời gian thực", "Bộ nhớ RAM thông thường"], "a": 2, "adv": false, "e": "Đồng hồ, thời gian và hành vi thời gian thực khó ảo hóa."}, {"q": "Trong học tập, VMWare Player thường được dùng để làm gì?", "o": ["Lập lịch CPU thời gian thực", "Thiết kế mạch điện tử", "Biên dịch nhân Linux", "Cài đặt, cấu hình, quản trị hệ thống và mạng"], "a": 3, "adv": false, "e": "Bài giảng: dùng cho học tập cài đặt, cấu hình, quản trị hệ thống và mạng."}, {"q": "Tập tin ISO thường được dùng trong máy ảo để làm gì?", "o": ["Lưu cấu hình máy ảo", "Làm ổ đĩa quang ảo để cài đặt hệ điều hành", "Làm card mạng ảo", "Lưu snapshot"], "a": 1, "adv": false, "e": "ISO gắn như CD/DVD ảo để cài HĐH."}, {"q": "Đâu là một giới hạn của VMWare Workstation Player so với ESXi?", "o": ["Không chạy được Linux khách", "Không có giao diện đồ họa", "Hiệu năng thấp hơn và không phù hợp chạy số lượng lớn máy ảo sản xuất", "Không tạo được máy ảo"], "a": 2, "adv": false, "e": "Đặc trưng nhược điểm của Hosted."}, {"q": "Lợi thế của paravirtualization so với ảo hóa toàn phần (khi chưa có hỗ trợ phần cứng) là gì?", "o": ["Hiệu năng cao hơn do giảm chi phí bẫy và dịch lệnh", "Không cần sửa HĐH khách", "Không cần hypervisor", "Hỗ trợ mọi HĐH đóng mã"], "a": 0, "adv": false, "e": "Paravirtualization giảm overhead nhưng cần sửa guest."}, {"q": "Một phòng lab sinh viên cần chạy vài máy ảo trên laptop cá nhân để học cài đặt Windows Server và Linux, ưu tiên dễ dùng. Lựa chọn hợp lý nhất?", "o": ["VMWare ESXi trên laptop", "VMWare Workstation Player (kiến trúc Hosted)", "vCenter Server", "Citrix XenServer"], "a": 1, "adv": true, "e": "Nhu cầu cá nhân, không đòi hỏi hiệu năng cao → Hosted."}, {"q": "Lý do kinh tế \"giảm chi phí cho hạ tầng vật lý\" thể hiện ở điểm nào?", "o": ["Giảm phí thuê bao Internet", "Giảm số lượng lập trình viên", "Giảm số lượng máy chủ, không gian lắp đặt, dây cáp, cấp nguồn", "Giảm chi phí bản quyền mọi phần mềm"], "a": 2, "adv": false, "e": "Giảm hạ tầng vật lý: ít máy chủ, ít không gian, cáp, nguồn."}, {"q": "ESX/ESXi quản lý thiết bị và tài nguyên tính toán theo cách nào?", "o": ["Thông qua trình duyệt web", "Trực tiếp quản lý các thiết bị và tài nguyên tính toán", "Thông qua máy ảo đầu tiên được tạo", "Thông qua HĐH Windows cài bên dưới"], "a": 1, "adv": false, "e": "ESX/ESXi trực tiếp quản lý thiết bị và tài nguyên."}, {"q": "Muốn chạy hypervisor 64-bit hiện đại, thường cần bật tính năng nào trong BIOS/UEFI?", "o": ["Wake-on-LAN", "Secure Erase", "Hỗ trợ ảo hóa phần cứng (Intel VT-x/AMD-V)", "Chế độ tiết kiệm pin"], "a": 2, "adv": false, "e": "VT-x/AMD-V cần được bật trong firmware."}, {"q": "PCI Passthrough (DirectPath I/O) cho phép gì?", "o": ["Tạo switch ảo", "Chia sẻ CPU cho nhiều host", "Gán trực tiếp một thiết bị PCI vật lý cho một máy ảo", "Chuyển máy ảo sang Hyper-V"], "a": 2, "adv": false, "e": "Passthrough gán thiết bị vật lý cho VM, giải quyết phần nào yêu cầu phần cứng chỉ định."}, {"q": "Phát biểu nào sau đây về VMWare ESX là SAI?", "o": ["ESX theo kiến trúc Hypervisor", "ESX cung cấp Service Console", "ESX được thay thế bởi ESXi", "ESX hiện vẫn được phát triển song song với ESXi ở các phiên bản mới nhất"], "a": 3, "adv": false, "e": "ESX dừng ở bản 4.1 và được thay bằng ESXi."}, {"q": "Thiết lập \"Limit\" cho máy ảo trong vSphere có ý nghĩa gì?", "o": ["Mức tài nguyên tối thiểu được đảm bảo", "Số lượng snapshot tối đa", "Mức tài nguyên tối đa máy ảo được phép sử dụng", "Số card mạng tối đa"], "a": 2, "adv": false, "e": "Limit là trần tài nguyên."}, {"q": "Ảo hóa ứng dụng (application virtualization) là gì?", "o": ["Tạo mạng riêng ảo", "Gộp nhiều ổ đĩa thành một", "Đóng gói ứng dụng để chạy tách biệt khỏi HĐH mà không cần cài đặt truyền thống", "Chạy toàn bộ HĐH trong máy ảo"], "a": 2, "adv": false, "e": "Ảo hóa ứng dụng tách ứng dụng khỏi HĐH bên dưới."}, {"q": "Các sản phẩm XenDesktop, XenApp, XenServer thuộc hãng nào?", "o": ["VMWare", "Citrix", "Oracle", "Microsoft"], "a": 1, "adv": false, "e": "Xen* là sản phẩm của Citrix trong danh sách bài giảng."}, {"q": "Theo bài giảng, hãng VMWare có những phần mềm ảo hóa nào?", "o": ["XenDesktop, XenApp, XenServer", "VirtualBox", "Virtual PC, Hyper-V", "VMWare Player, Server, Workstation, ESX vSphere, ESXi"], "a": 3, "adv": false, "e": "Danh sách VMWare: Player, Server, Workstation, ESX vSphere, ESXi."}, {"q": "Ưu điểm của kiến trúc Hypervisor (Bare-metal) là gì?", "o": ["Chạy như ứng dụng trên Windows", "Đơn giản, dễ sử dụng cho người mới", "Không cần phần cứng máy chủ", "Hiệu năng cao và có khả năng quản lý một lượng lớn máy ảo"], "a": 3, "adv": false, "e": "Bare-metal: hiệu năng cao, quản lý nhiều máy ảo."}, {"q": "Vì sao cần vCenter Server khi số lượng host ESXi tăng?", "o": ["Vì vCenter thay thế phần cứng", "Để quản lý tập trung, triển khai và cung cấp các tính năng cụm", "Vì ESXi không chạy được nếu thiếu vCenter", "Vì vCenter là hypervisor"], "a": 1, "adv": false, "e": "vCenter quản lý tập trung nhiều host."}, {"q": "vSphere trong \"VMWare ESX vSphere\" là gì?", "o": ["Một phần mềm ảo hóa cho máy Mac", "Một hệ điều hành khách của Microsoft", "Bộ nền tảng ảo hóa máy chủ của VMWare gồm ESX/ESXi và vCenter", "Một giao thức mạng riêng ảo"], "a": 2, "adv": false, "e": "vSphere là bộ nền tảng ảo hóa máy chủ gồm hypervisor và vCenter."}, {"q": "Một trường đại học cần phòng thực hành nơi sinh viên có thể phá hỏng hệ thống mà dễ khôi phục. Giải pháp phù hợp là gì?", "o": ["Cài lại HĐH máy thật sau mỗi buổi", "Dùng máy ảo với snapshot để khôi phục nhanh", "Cấm sinh viên cấu hình", "Dùng một máy chủ vật lý cho mỗi sinh viên"], "a": 1, "adv": false, "e": "Snapshot giúp khôi phục nhanh."}, {"q": "Xen là công nghệ hypervisor nằm phía sau sản phẩm nào trong bài giảng?", "o": ["Citrix XenServer", "Oracle VirtualBox", "Microsoft Virtual PC", "VMWare Fusion"], "a": 0, "adv": false, "e": "XenServer dựa trên hypervisor Xen."}, {"q": "Hệ thống nào sau đây được xem là tiền thân lịch sử của ảo hóa máy chủ?", "o": ["Mạng ARPANET", "Hệ thống máy ảo trên mainframe IBM (CP/CMS, VM/370)", "Hệ điều hành MS-DOS", "Trình duyệt Netscape"], "a": 1, "adv": false, "e": "IBM triển khai máy ảo trên mainframe từ thập niên 1960-70."}, {"q": "Template máy ảo được dùng để làm gì?", "o": ["Thay thế hypervisor", "Làm mẫu chuẩn để triển khai nhanh nhiều máy ảo giống nhau", "Mã hóa đĩa ảo", "Lưu nhật ký máy ảo"], "a": 1, "adv": false, "e": "Template giúp triển khai nhanh, phục vụ Infrastructure Provisioning."}, {"q": "Công ty có 8 máy chủ cũ, mỗi máy dùng trung bình 6 GB RAM và 20% của 1 CPU 4 lõi. Host mới có 64 GB RAM (dành 8 GB cho hypervisor) và 16 lõi. Có thể hợp nhất tất cả lên 1 host không (xét RAM và CPU)?", "o": ["Không, vì thiếu CPU", "Có, cần 48 GB RAM ≤ 56 GB và khoảng 6,4 lõi ≤ 16 lõi", "Không thể vì máy cũ khác hãng", "Không, vì thiếu RAM"], "a": 1, "adv": true, "e": "RAM 8×6=48 ≤ 56; CPU 8×0,8=6,4 lõi ≤ 16."}, {"q": "Theo bài giảng, ảo hóa trong tính toán có thể tạo phiên bản ảo của bao nhiêu nhóm đối tượng được liệt kê?", "o": ["5", "3", "6", "4"], "a": 0, "adv": false, "e": "Gồm phần cứng, HĐH, ứng dụng, thiết bị lưu trữ và tài nguyên mạng: 5 nhóm."}, {"q": "VMWare Player là phần mềm ảo hóa dùng cho nhu cầu nào?", "o": ["Trung tâm dữ liệu lớn", "Điện toán đám mây công cộng", "Nhu cầu cá nhân", "Hệ thống nhúng thời gian thực"], "a": 2, "adv": false, "e": "VMWare Player dành cho nhu cầu cá nhân."}, {"q": "Đối với tổ chức, lợi ích nào của ảo hóa liên quan tới yếu tố môi trường (Green IT)?", "o": ["Tăng lượng rác điện tử", "Tăng số lượng máy chủ", "Giảm tiêu thụ điện năng và nhiệt tỏa ra", "Tăng không gian phòng máy"], "a": 2, "adv": false, "e": "Ít máy chủ hơn, giảm điện năng và làm mát."}, {"q": "VMWare DRS (Distributed Resource Scheduler) làm gì?", "o": ["Tự động cân bằng tải máy ảo giữa các host trong cụm", "Giả lập CPU ARM", "Mã hóa đĩa ảo", "Sao lưu máy ảo ra băng từ"], "a": 0, "adv": false, "e": "DRS cân bằng tải bằng cách di chuyển VM giữa các host."}, {"q": "Theo bài giảng, ảo hóa có thể KHÔNG hoạt động tốt cho trường hợp nào?", "o": ["Hợp nhất các máy chủ tải thấp", "Môi trường học tập cài đặt hệ điều hành", "Phát triển phần mềm đa nền tảng", "Các ứng dụng sử dụng nhiều tài nguyên"], "a": 3, "adv": false, "e": "Ứng dụng dùng nhiều tài nguyên là hạn chế của ảo hóa."}, {"q": "Tính năng Drag and drop/copy-paste giữa máy chủ và máy ảo trong VMWare thường yêu cầu gì?", "o": ["Cài vCenter Server", "Dùng ESX 4.1", "Bật DCUI", "Cài đặt VMWare Tools trong máy ảo"], "a": 3, "adv": false, "e": "VMWare Tools cung cấp tính năng tích hợp."}]}, {"id": "c6e1", "group": "Chương 6 – Điện toán đám mây", "name": "Chương 6 – Đề 1", "qs": [{"q": "Một công ty thuê máy chủ ảo, tự cài Ubuntu và tự cài cơ sở dữ liệu lên đó. Công ty đang dùng mô hình dịch vụ nào?", "o": ["PaaS", "DaaS", "IaaS", "SaaS"], "a": 2, "adv": false, "e": "Thuê máy ảo và tự cài OS là IaaS."}, {"q": "Lợi ích \"Location independence\" có liên hệ gần nhất với đặc tính thiết yếu nào?", "o": ["Broad Network Access", "Resource Pooling", "Measured service", "Rapid elasticity"], "a": 0, "adv": false, "e": "Truy cập mọi nơi qua nhiều mạng."}, {"q": "Điều nào KHÔNG phải điểm khác biệt giữa Grid Computing và Cloud Computing theo bài giảng?", "o": ["Ứng dụng", "Tăng khả năng lưu trữ", "Mô hình nghiệp vụ", "Kiến trúc"], "a": 1, "adv": false, "e": "Tăng khả năng lưu trữ là điểm giống."}, {"q": "Có bao nhiêu mô hình triển khai đám mây được trình bày trong bài giảng?", "o": ["2", "5", "4", "3"], "a": 2, "adv": false, "e": "Gồm public, private, community, hybrid."}, {"q": "Chọn phát biểu đúng về On-demand self-service.", "o": ["Chỉ áp dụng cho lưu trữ, không cho máy chủ", "Người dùng phải chờ nhà cung cấp gọi lại xác nhận", "Người dùng tự cấp phát tài nguyên một cách tự động", "Chỉ quản trị viên nhà cung cấp mới cấp được"], "a": 2, "adv": false, "e": "Tự động, không cần tương tác."}, {"q": "Thỏa thuận mức dịch vụ (SLA) giữa nhà cung cấp và khách hàng đám mây thường quy định điều gì?", "o": ["Số nhân viên của khách hàng", "Mật khẩu của khách hàng", "Mã nguồn của hệ điều hành", "Cam kết về độ sẵn sàng, hiệu năng và bồi thường khi vi phạm"], "a": 3, "adv": false, "e": "SLA cam kết chất lượng dịch vụ."}, {"q": "Trong mô hình IaaS, khách hàng có quyền điều khiển những gì?", "o": ["Không điều khiển được gì", "Hệ điều hành, tiện ích lưu trữ, ứng dụng đã cài và một phần thành phần mạng", "Toàn bộ phần cứng vật lý trong trung tâm dữ liệu", "Chỉ cấu hình người dùng của ứng dụng"], "a": 1, "adv": false, "e": "Đây là phạm vi điều khiển của khách hàng IaaS."}, {"q": "Danh sách hạn chế của ĐTĐM trong bài giảng có bao nhiêu mục?", "o": ["4", "5", "9", "7"], "a": 3, "adv": false, "e": "Gồm 7 hạn chế."}, {"q": "Trong ba mô hình dịch vụ, mô hình nào thường linh hoạt nhất về lựa chọn phần mềm cài đặt?", "o": ["IaaS", "Như nhau", "PaaS", "SaaS"], "a": 0, "adv": false, "e": "IaaS cho cài phần mềm tùy ý."}, {"q": "Một nhóm nghiên cứu cần thuê 50 máy chủ Linux cấu hình cao trong 2 tuần để chạy mô phỏng. Dịch vụ nào trong bài giảng phù hợp nhất?", "o": ["Insightly", "Amazon EC2", "Dropbox", "Google Drive"], "a": 1, "adv": false, "e": "Thuê máy chủ ảo cấu hình tùy chọn → EC2."}, {"q": "Theo bài giảng, tổ chức nào là người cung cấp hạ tầng trong mô hình Public Cloud?", "o": ["Cơ quan quản lý viễn thông", "Cộng đồng người dùng", "Tổ chức cung cấp dịch vụ điện toán đám mây", "Khách hàng cá nhân"], "a": 2, "adv": false, "e": "Public cloud sở hữu bởi nhà cung cấp."}, {"q": "SaaS được dịch sang tiếng Việt là gì?", "o": ["Hạ tầng như một dịch vụ", "Phần mềm như một dịch vụ", "Nền tảng như một dịch vụ", "Bảo mật như một dịch vụ"], "a": 1, "adv": false, "e": "SaaS: Software as a Service."}, {"q": "Công nghệ nào giúp ứng dụng xử lý dữ liệu lớn bằng cách chia nhỏ việc tính toán cho nhiều nút?", "o": ["Web 2.0", "Network Latency", "Distributed Computing", "Thin client"], "a": 2, "adv": false, "e": "Tính toán phân tán."}, {"q": "Vì sao giao diện lập trình (API) không an toàn là nguy cơ lớn với đám mây?", "o": ["Vì API không liên quan đến bảo mật", "Vì người dùng quản lý, tương tác dịch vụ đám mây chủ yếu qua API/giao diện", "Vì API làm tăng độ trễ mạng", "Vì API chỉ dùng cho grid"], "a": 1, "adv": false, "e": "Mọi thao tác cấp phát, quản lý đều qua API."}, {"q": "Một máy ảo đám mây giá 0,10 USD/giờ. Công ty chạy 5 máy ảo, mỗi ngày 8 giờ, trong 20 ngày. Chi phí theo mô hình pay-as-you-go là bao nhiêu?", "o": ["360 USD", "40 USD", "100 USD", "80 USD"], "a": 3, "adv": true, "e": "5 × 8 × 20 × 0,10 = 80 USD."}, {"q": "Nhóm phát triển cần viết ứng dụng Python tự mở rộng khi tải tăng, không muốn quản lý máy chủ. Trong các dịch vụ bài giảng nêu, chọn dịch vụ nào và thuộc mô hình gì?", "o": ["Amazon EC2 – IaaS", "Salesforce.com – SaaS", "Google App Engine – PaaS", "Dropbox – Storage"], "a": 2, "adv": true, "e": "GAE hỗ trợ Python, tự mở rộng, là PaaS."}, {"q": "Mô hình triển khai nào có số lượng người thuê tiềm năng lớn nhất?", "o": ["Public Cloud", "Không có khác biệt", "Community Cloud", "Private Cloud"], "a": 0, "adv": false, "e": "Public mở cho công chúng."}, {"q": "\"Scalability and sustainability\" là lợi ích gì?", "o": ["Khả năng hoạt động ngoại tuyến", "Khả năng tự sửa mã nguồn", "Khả năng mở rộng và bền vững", "Khả năng bảo mật tuyệt đối"], "a": 2, "adv": false, "e": "Scalability and sustainability = mở rộng và bền vững."}, {"q": "Điều nào là hạn chế của điện toán đám mây theo bài giảng?", "o": ["Luôn yêu cầu phải có kết nối Internet", "Tự động hóa cao", "Tổng chi phí sở hữu rẻ", "Độc lập vị trí"], "a": 0, "adv": false, "e": "Hạn chế: luôn cần Internet."}, {"q": "Insightly được bài giảng xếp vào nhóm dịch vụ nào?", "o": ["PaaS", "IaaS", "DaaS", "SaaS (dịch vụ CRM)"], "a": 3, "adv": false, "e": "Insightly: SaaS CRM."}, {"q": "Ghép SAI giữa nhà cung cấp và nhóm dịch vụ theo bài giảng là?", "o": ["Microsoft Azure – IaaS", "Google App Engine – PaaS", "Salesforce.com – SaaS", "Dropbox – PaaS"], "a": 3, "adv": false, "e": "Dropbox thuộc nhóm Storage."}, {"q": "\"Distributed Computing\" (tính toán phân tán) đóng góp gì cho ĐTĐM?", "o": ["Phân chia công việc xử lý trên nhiều máy tính kết nối mạng", "Chạy mọi tác vụ trên một CPU duy nhất", "Chỉ cung cấp giao diện web", "Chỉ lưu trữ dữ liệu ngoại tuyến"], "a": 0, "adv": false, "e": "Tính toán phân tán dùng nhiều máy cùng xử lý."}, {"q": "Tiêu chí quyết định một đám mây là Public hay Private là gì?", "o": ["Đám mây dùng Linux hay Windows", "Đám mây có dùng ảo hóa hay không", "Đám mây phục vụ công chúng hay chỉ một tổ chức", "Đám mây đặt trong hay ngoài tòa nhà"], "a": 2, "adv": false, "e": "Phân biệt theo đối tượng phục vụ."}, {"q": "Website cần 2 máy ảo bình thường, nhưng 3 ngày cuối tháng cần 10 máy ảo. Giá 2 USD/máy/ngày, th g → private."}, {"q": "Lời gọi accept() phía server có tính chất gì?", "o": ["Gửi dữ liệu tới client", "Tạo ring logic", "Chặn (block) chờ đến khi có client kết nối", "Trả về ngay không chờ"], "a": 2, "adv": false, "e": "accept thường chặn chờ kết nối."}, {"q": "Dịch vụ nào thuộc PaaS trong số sau?", "o": ["Amazon EC2", "Red Hat OpenShift", "Salesforce.com", "Dropbox"], "a": 1, "adv": false, "e": "OpenShift là PaaS."}, {"q": "Câu nào phù hợp với nhận định \"DFS có khả năng mở rộng tốt và khả năng chịu lỗi cao\"?", "o": ["Đây là đặc điểm riêng của FAT32", "Đây là một trong các lý do khiến DFS được cần đến", "Đây là nhược điểm của DFS", "Đây là đặc điểm của đĩa mềm"], "a": 1, "adv": false, "e": "Bài giảng nêu đây là lý do cần DFS."}, {"q": "UTC là viết tắt của thuật ngữ nào?", "o": ["Unified Time Clock", "Universal Time Counter", "Uniform Transmission Clock", "Universal Coordinated Time"], "a": 3, "adv": false, "e": "UTC là Universal Coordinated Time (giờ phối hợp quốc tế)."}, {"q": "Ứng dụng nào sau đây phù hợp nhất để chạy trong máy ảo trên VMWare Player?", "o": ["Hệ thống giao dịch chứng khoán tần suất cao", "Lab mô phỏng mạng gồm vài máy chủ Linux để học cấu hình DNS, DHCP", "Kiểm thử hiệu năng tối đa card mạng", "Hệ thống điều khiển robot thời gian thực"], "a": 1, "adv": false, "e": "Học tập, không cần hiệu năng cao."}, {"q": "Socket UDP có cần gọi listen/accept không?", "o": ["Có, bắt buộc", "Chỉ cần listen", "Chỉ cần accept", "Không, UDP gửi nhận datagram trực tiếp"], "a": 3, "adv": false, "e": "UDP phi kết nối, không dùng listen/accept."}, {"q": "Đồng bộ nội bộ (internal) các đồng hồ yêu cầu điều gì?", "o": ["Sai số tuyệt đối giữa các đồng hồ với nhau nhỏ hơn D", "Mỗi đồng hồ phải khớp với UTC trong giới hạn D", "Mỗi đồng hồ phải có GPS", "Sai số giữa các đồng hồ bằng đúng D"], "a": 0, "adv": false, "e": "Đồng bộ nội bộ: chênh lệch giữa các đồng hồ < D."}, {"q": "Cisco IOS khác iOS của Apple ở điểm nào?", "o": ["Hai cái là một sản phẩm", "Cisco IOS là HĐH cho g"], "a": 0, "adv": false, "e": "Thứ tự toàn phần giúp các tiến trình thống nhất thứ tự xử lý yêu cầu."}, {"q": "Nguyên nhân vật lý chủ yếu gây ra độ trôi của đồng hồ máy tính là gì?", "o": ["Tần số dao động của tinh thể thạch anh không hoàn toàn ổn định, phụ thuộc nhiệt độ và chất lượng", "Độ trễ của mạng Internet", "Lỗi phần mềm của hệ điều hành", "Sự khác biệt về múi giờ"], "a": 0, "adv": false, "e": "Thạch anh dao động không lý tưởng nên đồng hồ trôi."}, {"q": "Ưu điểm nổi bật của kiến trúc hosted là gì?", "o": ["Bảo mật tuyệt đối", "Dễ cài đặt, tận dụng được driver và phần cứng mà host OS hỗ trợ", "Hiệu năng cao nhất trong các kiến trúc", "Không cần hệ điều hành nào"], "a": 1, "adv": false, "e": "Hosted cài như ứng dụng thông thường nên dễ triển khai."}, {"q": "Khách hàng SaaS thường chỉ có thể điều chỉnh gì?", "o": ["Một số thiết lập cấu hình ứng dụng giới hạn dành cho người dùng", "Cấu hình lưu trữ vật lý", "Hệ điều hành của máy chủ", "Mã nguồn nền tảng"], "a": 0, "adv": false, "e": "SaaS chỉ cho phép thay đổi cấu hình người dùng ở mức hạn chế."}, {"q": "Mục tiêu nào KHÔNG phải mục tiêu thiết kế của NTP?", "o": ["Hoạt động tin cậy dù kết nối mạng bị gián đoạn", "Cho phép client trên Internet đồng bộ chính xác với UTC", "Cho phép đồng bộ thường xuyên với số lượng client lớn", "Bảo đảm thứ tự nhân quả giữa các sự kiện mà không cần đồng hồ vật lý"], "a": 3, "adv": false, "e": "Thứ tự nhân quả là nhiệm vụ của đồng hồ logic, không phải NTP."}, {"q": "Vai trò của Web service/SOA đối với đám mây là gì?", "o": ["Thay thế phần cứng máy chủ", "Cho phép các thành phần dịch vụ giao tiếp qua giao diện chuẩn trên mạng", "Tạo máy ảo", "Làm mát trung tâm dữ liệu"], "a": 1, "adv": false, "e": "Kiến trúc hướng dịch vụ giúp đóng gói và cung cấp chức năng như dịch vụ."}, {"q": "Mục đích của việc đo lường trong Measured service là gì?", "o": ["Thay thế cơ chế xác thực", "Giới hạn số người dùng truy cập", "Mã hóa toàn bộ dữ liệu", "Kiểm soát, tối ưu tài nguyên và minh bạch cho cả nhà cung cấp lẫn khách hàng"], "a": 3, "adv": false, "e": "Đo kiểm giúp giám sát, kiểm soát, báo cáo minh bạch việc sử dụng."}]}, {"id": "th2", "group": "Đề tổng hợp lý thuyết (định nghĩa, so sánh, nền tảng)", "name": "Lý thuyết – Đề 2", "qs": [{"q": "Private Cloud có bắt buộc phải đặt trong khuôn viên của tổ chức sở hữu không?", "o": ["Có, luôn phải đặt tại chỗ", "Không, có thể đặt tại chỗ hoặc bên ngoài", "Có, và phải do nhà nước quản lý", "Không, luôn phải đặt ở nhà cung cấp công cộng"], "a": 1, "adv": false, "e": "Private Cloud có thể on-premise hoặc off-premise, do tổ chức hoặc bên thứ ba quản lý."}, {"q": "So với peer-to-peer, mô hình client/server có đặc điểm nào về nhân lực?", "o": ["Chỉ cần quản trị khi mạng dưới 5 máy", "Không cần ai quản trị", "Mạng lớn đòi hỏi nhân viên quản trị có trình độ, kinh nghiệm", "Mỗi người dùng tự quản trị máy của mình là đủ"], "a": 2, "adv": false, "e": "Nhược điểm bảo trì của client/server."}, {"q": "Hai sự kiện được gọi là “đồng thời” (concurrent, a || b) khi nào?", "o": ["Chúng có cùng giá trị đồng hồ vật lý", "Chúng xảy ra trên cùng một tiến trình", "Không có a → b và cũng không có b → a", "Một sự kiện gửi và sự kiện kia nhận cùng thông điệp"], "a": 2, "adv": false, "e": "Đồng thời nghĩa là không có quan hệ nhân quả."}, {"q": "Với ngữ nghĩa phiên làm việc, nếu hai client cùng ghi rồi đóng file, kết quả cuối cùng thường là gì?", "o": ["Hai nội dung được trộn tự động", "Cả hai thay đổi đều bị hủy", "Hệ thống từ chối cả hai lần đóng", "Phiên bản của client đóng file sau cùng có thể ghi đè phiên bản trước"], "a": 3, "adv": false, "e": "Mỗi phiên làm việc trên bản riêng nên bản đóng sau cùng thường thắng."}, {"q": "Quy tắc so sánh V(a) ≤ V(b) giữa hai đồng hồ vector được hiểu là gì?", "o": ["Tổng các thành phần của V(a) nhỏ hơn tổng của V(b)", "Thành phần đầu của V(a) nhỏ hơn của V(b)", "Ít nhất một thành phần của V(a) nhỏ hơn", "Mọi thành phần của V(a) đều nhỏ hơn hoặc bằng thành phần tương ứng của V(b)"], "a": 3, "adv": false, "e": "So sánh vector theo từng thành phần."}, {"q": "Một trường đại học muốn sinh viên viết bài cùng lúc trên một tài liệu trực tuyến, không cần cài phần mềm và không quản lý máy chủ. Giải pháp phù hợp nhất?", "o": ["Dùng ứng dụng soạn thảo SaaS trên trình duyệt", "Xây dựng Private Cloud riêng", "Thuê máy ảo IaaS rồi tự cài bộ văn phòng", "Dùng PaaS để tự lập trình trình soạn thảo"], "a": 0, "adv": true, "e": "SaaS đáp ứng nhu cầu dùng ngay, cộng tác, không quản trị."}, {"q": "Khi một máy chủ NTP mất kết nối với nguồn phía trên, cấu trúc NTP phản ứng thế nào?", "o": ["Toàn bộ mạng NTP ngừng hoạt động", "Mạng con đồng bộ có thể tự cấu hình lại để máy chủ nhận thời gian từ nguồn khác", "Máy chủ đó tự trở thành tầng 1", "Mọi client chuyển sang Berkeley"], "a": 1, "adv": false, "e": "NTP có khả năng tái cấu hình khi có lỗi."}, {"q": "Snapshot của máy ảo dùng để làm gì?", "o": ["Xóa máy ảo", "Lưu trạng thái máy ảo tại một thời điểm để có thể quay lại", "Chụp ảnh màn hình của host", "Tăng RAM cho máy ảo"], "a": 1, "adv": false, "e": "Snapshot cho phép khôi phục trạng thái trước đó."}, {"q": "Trong NFS, client đưa thư mục từ xa vào cây thư mục của mình bằng cơ chế nào?", "o": ["Sao chép toàn bộ đĩa server", "Mount thư mục được server xuất (export) vào một điểm mount cục bộ", "Đổi tên máy client", "Dùng không gian tên toàn cục duy nhất"], "a": 1, "adv": false, "e": "NFS dùng mount để ghép thư mục xa."}, {"q": "Nguyên nhân chủ yếu khiến máy ảo trong mô hình hosted chịu overhead lớn hơn mô hình bare-metal là gì?", "o": ["Do guest OS không có bộ nhớ", "Do không có trình điều khiển thiết bị", "Do yêu cầu truy cập phần cứng phải đi qua thêm lớp host OS", "Do không dùng được CPU đa nhân"], "a": 2, "adv": false, "e": "Thêm một lớp trung gian gây overhead."}, {"q": "Ảo hóa máy chủ (server virtualization) nghĩa là gì?", "o": ["Lắp thêm nhiều card mạng", "Chia một máy chủ vật lý thành nhiều máy chủ ảo độc lập", "Ghép nhiều ứng dụng vào một tiến trình", "Thay thế máy chủ bằng máy trạm"], "a": 1, "adv": false, "e": "Một server vật lý chạy nhiều server ảo."}, {"q": "Trong hệ thống nhiều bản sao dữ liệu, nút điều phối việc ghi bị sập và các nút còn lại cần tự chọn nút thay thế. Cơ chế nào phù hợp?", "o": ["Giải thuật bầu chọn như Bully hoặc Ring", "Loại trừ tương hỗ tập trung", "Socket UDP quảng bá", "Marshalling tham số"], "a": 0, "adv": true, "e": "Chọn lại điều phối viên là bài toán bầu chọn."}, {"q": "Vai trò của nhật ký thao tác (operation log) và điểm kiểm tra của master GFS là gì?", "o": ["Cho phép khôi phục trạng thái metadata của master sau sự cố", "Mã hóa dữ liệu người dùng", "Tăng tốc truyền dữ liệu giữa client và chunkserver", "Lưu nội dung dữ liệu của các chunk"], "a": 0, "adv": false, "e": "Thao tác master được ghi log/checkpoint để phục hồi."}, {"q": "Ưu điểm 'Tập trung' của client/server mang lại lợi ích trực tiếp nào?", "o": ["Máy chủ kiểm soát tài nguyên và đảm bảo an toàn dữ liệu", "Không cần mua máy chủ", "Mạng vẫn chạy khi máy chủ hỏng", "Mỗi người tự quản lý máy của mình"], "a": 0, "adv": false, "e": "Centralized: máy chủ kiểm soát tài nguyên, bảo vệ dữ liệu."}, {"q": "Thiết bị phần cứng đặc thù (khóa bản quyền USB, card chuyên dụng) gây khó khăn cho ảo hóa vì sao?", "o": ["Vì chúng làm máy ảo chạy quá nhanh", "Vì chúng không có driver Windows", "Vì chúng quá rẻ", "Máy ảo có thể không truy cập trực tiếp được hoặc hypervisor không hỗ trợ thiết bị đó"], "a": 3, "adv": false, "e": "Hỗ trợ thiết bị đặc thù trong VM là một hạn chế."}, {"q": "Một ngân hàng giữ dữ liệu khách hàng trong hạ tầng riêng nhưng muốn dùng tài nguyên công cộng để chạy thử nghiệm phần mềm không chứa dữ liệu nhạy cảm. Mô hình triển khai phù hợp?", "o": ["Hybrid Cloud", "Public Cloud hoàn toàn", "Chỉ dùng máy tính cá nhân", "Community Cloud"], "a": 0, "adv": true, "e": "Kết hợp đám mây riêng cho dữ liệu nhạy cảm và công cộng cho tác vụ khác."}, {"q": "Trong dịch vụ từ xa, mỗi thao tác đọc/ghi của client được chuyển thành gì?", "o": ["Một lệnh mount mới", "Một d (gửi) và receive (nhận)."}, {"q": "Một OS thông thường được trang bị công cụ mạng vẫn chưa phải NOS chủ yếu vì lý do gì?", "o": ["Nó không có khả năng kết nối mạng", "Nó không có trình điều khiển thiết bị", "Nó không được thiết kế đặc biệt để mạng hoạt động đạt hiệu năng tối ưu", "Nó không có giao diện đồ họa"], "a": 2, "adv": false, "e": "NOS khác OS thường ở chỗ được thiết kế đặc biệt cho hiệu năng mạng tối ưu."}, {"q": "Yêu cầu nào là quan trọng đối với tên nhận dạng có cấu trúc trong toàn DFS?", "o": ["Mỗi tên phải là duy nhất trên toàn hệ thống", "Mỗi tên phải dễ nhớ với người dùng", "Tên phải trùng với tên máy chủ", "Tên phải chứa ngày tạo file"], "a": 0, "adv": false, "e": "Tên nhận dạng phải đơn nhất toàn cục để tránh nhầm lẫn."}, {"q": "Trong Berkeley, vì sao master loại bỏ các đồng hồ có giá trị lệch quá xa trước khi lấy trung bình?", "o": ["Để tránh một đồng hồ hỏng làm sai lệch giá trị trung bình chung", "Để giảm số thông điệp gửi đi", "Để tiết kiệm bộ nhớ", "Vì master không đọc được các giá trị đó"], "a": 0, "adv": false, "e": "Trung bình chịu lỗi loại các giá trị bất thường."}, {"q": "Trong mô hình client/server, yếu tố nào quyết định máy trạm được truy nhập tài nguyên nào trên máy chủ?", "o": ["Tốc độ CPU của máy trạm", "Quyền truy nhập đã được xác định trước", "Thứ tự bật máy", "Dung lượng ổ cứng của máy trạm"], "a": 1, "adv": false, "e": "Máy trạm truy nhập theo quyền đã xác định trước."}, {"q": "Trong mô hình đồng hồ máy tính, “độ phân giải” (resolution) của đồng hồ là gì?", "o": ["Tốc độ truyền thông điệp", "Khoảng thời gian nhỏ nhất giữa hai lần cập nhật giá trị đồng hồ", "Độ lệch giữa đồng hồ và UTC", "Số máy chủ NTP mà máy kết nối"], "a": 1, "adv": false, "e": "Hai sự kiện trong cùng một tick có thể nhận cùng tem."}, {"q": "Hệ điều hành chạy bên trong một máy ảo thường được gọi là gì?", "o": ["Hệ điều hành nhúng", "Hệ điều hành khách (guest OS)", "Firmware", "Hệ điều hành chủ (host OS)"], "a": 1, "adv": false, "e": "OS bên trong VM là guest OS."}, {"q": "Họ HĐH mạng nào phù hợp với mô tả 'có nhiều bản phân phối như Debian, Ubuntu, SUSE'?", "o": ["Microsoft Windows Servers", "HĐH mạng chuyên dụng", "MS-DOS", "Linux"], "a": 3, "adv": false, "e": "Debian, Ubuntu, SUSE là các bản phân phối Linux."}, {"q": "Đặc trưng kiến trúc nào giúp NTP mở rộng được trên quy mô Internet?", "o": ["Mỗi máy tự đồng bộ không cần máy chủ", "Cây phân cấp các máy chủ theo tầng (stratum), tầng trên đồng bộ cho tầng dưới", "Chỉ dùng multicast trong mạng LAN", "Một máy chủ trung tâm duy nhất phục vụ toàn cầu"], "a": 1, "adv": false, "e": "Cấu trúc phân tầng chia tải và mở rộng tốt."}, {"q": "Trình duyệt web và email client thuộc loại ứng dụng mạng nào?", "o": ["Ứng dụng trực tiếp phục vụ người dùng cuối", "Dịch vụ cân bằng tải", "Ứng dụng máy chủ phục vụ hệ thống thứ cấp", "Thành phần nhân của HĐH mạng"], "a": 0, "adv": false, "e": "Đây là ứng dụng phía người dùng cuối trên HĐH máy bàn."}, {"q": "Để tạo thứ tự toàn phần (total order) từ đồng hồ Lamport, người ta thường làm gì?", "o": ["Ghép tem Lamport với định danh tiến trình để phá thế hòa khi tem bằng nhau", "Nhân tem với số tiến trình", "Dùng đồng hồ vật lý thay cho tem", "Loại bỏ các sự kiện có tem bằng nhau"], "a": 0, "adv": false, "e": "Cặp (tem, ID) cho thứ tự toàn phần."}, {"q": "Vì sao hypervisor được xem là thành phần cần bảo vệ đặc biệt?", "o": ["Nó chỉ là ứng dụng văn phòng", "Nó không có mã nguồn", "Nó chạy bên trong guest OS", "Nó kiểm soát toàn bộ máy ảo trên host, bị xâm nhập sẽ ảnh hưởng tất cả"], "a": 3, "adv": false, "e": "Hypervisor là điểm kiểm soát trung tâm."}, {"q": "Cân bằng tải (load balancing) đóng vai trò gì trong hạ tầng đám mây?", "o": ["Tính hóa đơn khách hàng", "Tạo ảnh máy", "Phân phối yêu cầu đều giữa nhiều máy chủ để tăng hiệu năng và sẵn sàng", "Mã hóa dữ liệu lưu trữ"], "a": 2, "adv": false, "e": "Cân bằng tải tránh quá tải và hỗ trợ co giãn."}, {"q": "Yêu cầu 'trong suốt' của DFS bao gồm hai khía cạnh nào?", "o": ["Phân quyền và kiểm toán", "Mạng trong suốt và tính di động của người dùng", "Mã hóa và nén dữ liệu", "Sao lưu và phục hồi"], "a": 1, "adv": false, "e": "Bài giảng nêu network transparency và user mobility."}, {"q": "Về phía lập trình viên, RPC cố gắng đạt được tính trong suốt theo nghĩa nào?", "o": ["Server không cần cổng", "Dữ liệu truyền không cần mã hóa", "Client có thể xem mã nguồn server", "Lời gọi thủ tục từ xa trông giống như lời gọi thủ tục cục bộ đối với lập trình viên"], "a": 3, "adv": false, "e": "RPC che giấu việc truyền mạng để lời gọi từ xa giống gọi cục bộ."}, {"q": "Điều gì là rủi ro điển hình khi phụ thuộc vào một nhà cung cấp PaaS?", "o": ["Phải tự mua máy chủ vật lý", "Không thể truy cập qua Internet", "Phải tự vá hệ điều hành", "Bị khóa vào nền tảng (vendor lock-in) do API và môi trường riêng"], "a": 3, "adv": false, "e": "Ứng dụng viết theo API riêng của nền tảng khó chuyển sang nhà cung cấp khác."}, {"q": "Điểm khác biệt chính của ESXi so với ESX truyền thống là gì?", "o": ["ESXi không hỗ trợ máy ảo", "ESXi cần Windows làm host", "ESXi lược bỏ Service Console nên gọn nhẹ hơn", "ESXi chỉ chạy trên máy tính để bàn"], "a": 2, "adv": false, "e": "ESXi bỏ console dựa trên Linux, giảm kích thước và bề mặt tấn công."}, {"q": "Shadow volume và File Replication có chung mục đích nào?", "o": ["Sao lưu và dự phòng dữ liệu", "Phân giải tên miền", "Điều khiển máy từ xa", "Cân bằng tải web"], "a": 0, "adv": false, "e": "Cả hai thuộc nhóm sao lưu và dự phòng."}, {"q": "Phát biểu nào mô tả đúng trong suốt vị trí?", "o": ["File chỉ được lưu ở một máy cố định duy nhất", "Tên file không để lộ vị trí lưu trữ vật lý của file", "Tên file chứa địa chỉ IP của server", "Tên file phải đổi khi file chuyển máy"], "a": 1, "adv": false, "e": "Location transparency: tên không gợi ý vị trí vật lý."}]}, {"id": "th3", "group": "Đề tổng hợp lý thuyết (định nghĩa, so sánh, nền tảng)", "name": "Lý thuyết – Đề 3", "qs": [{"q": "Ưu điểm của loại trừ tương hỗ tập trung là gì?", "o": ["Chịu được lỗi điều phối viên hoàn toàn", "Không cần trao đổi thông điệp", "Không có nút trung tâm", "Đơn giản, dễ cài đặt và công bằng theo thứ tự yêu cầu"], "a": 3, "adv": false, "e": "Thiết kế đơn giản, phục vụ theo hàng đợi FIFO."}, {"q": "Tính đơn điệu (monotonicity) của đồng hồ phần mềm yêu cầu điều gì?", "o": ["Đồng hồ phải khớp UTC từng mili giây", "Giá trị đồng hồ luôn tăng theo thời gian, không bao giờ quay ngược", "Đồng hồ chỉ tăng khi có thông điệp", "Mọi máy có cùng giá trị đồng hồ"], "a": 1, "adv": false, "e": "Đơn điệu nghĩa là t' > t thì C(t') > C(t)."}, {"q": "Card mạng ảo (vNIC) gán cho máy ảo có đặc điểm gì?", "o": ["Là card vật lý gắn thêm vào host", "Không có địa chỉ MAC", "Là thiết bị mô phỏng do hypervisor cung cấp, có địa chỉ MAC riêng", "Chỉ dùng cho host"], "a": 2, "adv": false, "e": "vNIC là thiết bị ảo có MAC riêng."}, {"q": "Ngữ nghĩa chia sẻ trả lời câu hỏi cốt lõi nào?", "o": ["Tốc độ mạng tối thiểu là bao nhiêu", "File được lưu trên đĩa loại nào", "Ai được phép tạo file", "Khi nhiều client cùng truy nhập một file, thay đổi của một client được client khác thấy khi nào"], "a": 3, "adv": false, "e": "Ngữ nghĩa chia sẻ quy định tính hiển thị của cập nhật."}, {"q": "Hệ phân tán “đồng bộ” (synchronous) khác hệ “không đồng bộ” ở điểm nào liên quan đến đồng bộ thời gian?", "o": ["Hệ đồng bộ biết trước giới hạn của độ trễ thông điệp và tốc độ trôi đồng hồ", "Hệ không đồng bộ không có đồng hồ cục bộ", "Hệ đồng bộ không có độ trễ mạng", "Hệ đồng bộ chỉ có một máy"], "a": 0, "adv": false, "e": "Hệ đồng bộ có các giới hạn xác định, hệ không đồng bộ thì không."}, {"q": "Một đồng hồ được gọi là “đúng” (correct) theo nghĩa nào trong lý thuyết đồng bộ?", "o": ["Nó luôn hiển thị chính xác UTC", "Nó có độ phân giải vô hạn", "Nó không bao giờ cần hiệu chỉnh", "Tốc độ trôi của nó nằm trong giới hạn cho phép đã biết"], "a": 3, "adv": false, "e": "Đồng hồ đúng là có độ trôi bị chặn, không phải không sai."}, {"q": "Ba giao thức SMTP, POP, IMAP được nhóm chung trong dịch vụ nào?", "o": ["Email", "Quản trị mạng", "Cấp phát địa chỉ IP", "Web"], "a": 0, "adv": false, "e": "Bài giảng ghi Email (SMTP, POP, IMAP)."}, {"q": "Tính độc lập vị trí trong Resource pooling được hiểu như thế nào?", "o": ["Tài nguyên chỉ đặt tại văn phòng khách hàng", "Khách hàng thường không kiểm soát vị trí chính xác của tài nguyên, chỉ có thể chọn ở mức trừu tượng cao", "Dịch vụ không phụ thuộc vào mạng", "Khách hàng luôn biết máy chủ vật lý nào đang chạy dịch vụ"], "a": 1, "adv": false, "e": "Người dùng chỉ có thể chỉ định vị trí ở mức cao như quốc gia, vùng, trung tâm dữ liệu."}, {"q": "GFS xem hỏng hóc phần cứng là điều gì trong thiết kế?", "o": ["Là lý do để dừng toàn hệ thống", "Là chuyện bình thường, nên giám sát và phục hồi tự động là bắt buộc", "Là lỗi của người dùng", "Là sự kiện cực hiếm, có thể bỏ qua"], "a": 1, "adv": false, "e": "GFS chạy trên phần cứng giá rẻ nên coi lỗi là thường xuyên."}, {"q": "Một hệ thống nhỏ, mạng ổn định, cần cài đặt nhanh cơ chế để các máy lần lượt dùng một máy in chung. Giải pháp loại trừ tương hỗ nào hợp lý nhất?", "o": ["Phân tán toàn phần", "Bầu chọn Bully trước mỗi lần in", "Không cần loại trừ tương hỗ", "Loại trừ tương hỗ tập trung với một điều phối viên quản lý hàng đợi"], "a": 3, "adv": true, "e": "Phương pháp tập trung đơn giản, đủ dùng khi điều kiện ổn định."}, {"q": "Yêu cầu an toàn (safety) của giải thuật loại trừ tương hỗ là gì?", "o": ["Thông điệp phải được mã hóa", "Mọi tiến trình phải vào đoạn găng cùng lúc", "Không bao giờ có hai tiến trình cùng ở trong đoạn găng", "Tiến trình phải có ID chẵn"], "a": 2, "adv": false, "e": "Safety: tối đa một tiến trình trong CS."}, {"q": "Yếu tố kỹ thuật nào giúp Hybrid Cloud vận hành như một thể thống nhất?", "o": ["Chỉ dùng một nhà cung cấp duy nhất", "Các đám mây thành phần phải dùng chung một trung tâm dữ liệu", "Loại bỏ hoàn toàn đám mây riêng", "Công nghệ chuẩn hoặc độc quyền cho phép di chuyển dữ liệu và ứng dụng giữa các đám mây"], "a": 3, "adv": false, "e": "Đám mây lai liên kết các đám mây độc lập bằng công nghệ cho phép tính khả chuyển."}, {"q": "Khó khăn đặc trưng của giải thuật thẻ bài là gì?", "o": ["Phát hiện và tái tạo thẻ bài khi thẻ bị mất", "Phải gửi yêu cầu tới mọi nút", "Không xác định được thứ tự vòng", "Cần điều phối viên trung tâm"], "a": 0, "adv": false, "e": "Mất token khó phát hiện vì khoảng vắng token không giới hạn."}, {"q": "Một phòng thí nghiệm có 8 máy, sinh viên tự chia sẻ thư mục cho nhau, không có máy chủ; dữ liệu nằm rải rác và hay thất lạc. Nguyên nhân gốc rễ theo đặc điểm mô hình là gì?", "o": ["HĐH các máy là đơn nhiệm", "Thiếu dịch vụ DNS", "Mạng ngang hàng thiếu nơi lưu trữ và cơ chế quản lý tập trung", "Mạng client/server phụ thuộc vào máy chủ"], "a": 2, "adv": true, "e": "Đó là nhược điểm không tập trung của mạng P2P."}, {"q": "Bản chất của hint trong kỹ thuật đặt tên là gì?", "o": ["Một loại mật khẩu truy nhập", "Thông tin bắt buộc luôn đúng", "Thông tin vị trí được lưu tạm, có thể không chính xác nhưng giúp tăng tốc", "Bản sao đầy đủ của file"], "a": 2, "adv": false, "e": "Hint là thông tin gợi ý; nếu sai thì client tìm lại theo cách thông thường."}, {"q": "Community Cloud phù hợp với nhóm tổ chức có đặc điểm gì?", "o": ["Chỉ gồm cá nhân dùng email", "Hoàn toàn không liên quan đến nhau", "Cạnh tranh trực tiếp và không chia sẻ yêu cầu", "Cùng chia sẻ mối quan tâm như sứ mệnh, yêu cầu an ninh, chính sách tuân thủ"], "a": 3, "adv": false, "e": "Đám mây cộng đồng dành cho các tổ chức có mối quan tâm chung."}, {"q": "Một công ty có nhiều máy chủ vật lý cũ, mỗi máy chạy một dịch vụ và dùng rất ít CPU. Giải pháp ảo hóa phù hợp nhất là gì?", "o": ["Cài mọi dịch vụ lên một máy trạm không ảo hóa", "Tắt bớt các dịch vụ", "Mua thêm máy chủ vật lý cho mỗi dịch vụ", "Hợp nhất các dịch vụ thành máy ảo chạy trên ít máy chủ vật lý mạnh hơn"], "a": 3, "adv": true, "e": "Đây là kịch bản hợp nhất máy chủ điển hình."}, {"q": "Trong giải thuật bầu chọn vòng (Ring), thông điệp ELECTION được lưu chuyển thế nào?", "o": ["Gửi tớ   view='home';S=null;X=null;closeSheet();
  const m=getMode();
  let h='<div class="wrap"><h1>Ôn thi Hệ điều hành mạng</h1><div class="mut">'+DATA.exams.length+' đề × 100 câu · tự lưu tiến độ trên máy này</div>'
   +'<div class="seg"><button class="'+(m==='practice'?'on':'')+'" onclick="setMode(\'practice\')">Luyện tập<small>Chọn xong hiện đáp án ngay</small></button>'
   +'<button class="'+(m==='exam'?'on':'')+'" onclick="setMode(\'exam\')">Thi thử<small>Nộp bài mới xem đáp án</small></button></div>';
  const groups={};DATA.exams.forEach((e,i)=>{(groups[e.group]=groups[e.group]||[]).push(i)});
  for(const g in groups){
    h+='<h2>'+esc(g)+'</h2><div class="grid">';
    groups[g].forEach(i=>{
      const e=DATA.exams[i],st=LS.get('st_'+e.id),b=LS.get('best_'+e.id);
      let s='<small>Chưa làm</small>';
      if(st&&st.sub)s='<small class="done">Đã nộp: '+scoreOf(e,st)+'/'+e.qs.length+'</small>';
      else if(st&&cnt(st))s='<small class="prog">Đang làm dở '+cnt(st)+'/'+e.qs.length+'</small>';
      h+='<button class="card" onclick="openExam('+i+')"><b>'+esc(e.name)+'</b>'+s+(b!=null?'<small>Cao nhất: '+b+'/100</small>':'')+'</button>';
    });
    h+='</div>';
  }
  app.innerHTML=h+'</div>';window.scrollTo(0,0);
}
function save(){LS.set('st_'+X.id,S)}
function fresh(){return{ans:{},pos:0,sub:false,mode:getMode(),filter:false}}
function openExam(i){
  X=DATA.exams[i];S=LS.get('st_'+X.id)||fresh();
  if(!S.ans)S=fresh();
  if(S.sub){res()}else{view='q';renderQ()}
}
function order(){
  if(S.filter){const w=[];X.qs.forEach((q,k)=>{if(S.ans[k]!==q.a)w.push(k)});if(w.length)return w;S.filter=false}
  return X.qs.map((_,k)=>k);
}
function renderQ(){
  view='q';closeSheet();
  const ord=order();if(S.pos>=ord.length)S.pos=ord.length-1;if(S.pos<0)S.pos=0;
  const k=ord[S.pos],q=X.qs[k],a=S.ans[k];
  const locked=S.sub||(S.mode==='practice'&&a!=null);
  const n=cnt(S);
  let h='<div class="top"><div class="r"><button class="ib" onclick="home()" aria-label="Về danh sách">←</button><div class="ttl">'+esc(X.name)+(S.filter?' · câu sai':'')+'</div><button class="ib" onclick="openSheet()">☰ '+n+'/'+X.qs.length+'</button></div><div class="pb"><i style="width:'+(n/X.qs.length*100)+'%"></i></div></div>';
  h+='<div class="qwrap"><div class="qn">Câu '+(k+1)+'/'+X.qs.length+(S.filter?' · '+(S.pos+1)+'/'+ord.length+' câu sai':'')+(q.adv?'<span class="tag">Nâng cao</span>':'')+'</div><div class="qt">'+esc(q.q)+'</div>';
  q.o.forEach((o,j)=>{
    let c='o';
    if(locked){if(j===q.a)c+=' ok';else if(j===a)c+=' bad'}else if(a===j)c+=' sel';
    h+='<button class="'+c+'" '+(locked?'disabled':'')+' onclick="choose('+j+')"><span class="l">'+L[j]+'</span><span>'+esc(o)+'</span></button>';
  });
  if(locked){
    const r=a===q.a;
    h+='<div class="fb">'+(r?'<span class="rok">✓ Đúng</span>':'<span class="rbad">✗ '+(a==null?'Chưa trả lời':'Sai — bạn chọn '+L[a])+'</span> · Đáp án đúng: <b>'+L[q.a]+'</b>')+(q.e?'<div class="mut" style="margin-top:6px;font-size:.9rem">'+esc(q.e)+'</div>':'')+'</div>';
  }
  const last=S.pos===ord.length-1;
  h+='</div><div class="bot"><div class="r"><button class="nb" onclick="go(-1)" '+(S.pos===0?'disabled':'')+'>‹ Trước</button><button class="nb p" onclick="'+(last?(S.sub?'res()':'openSheet()'):'go(1)')+'">'+(last?(S.sub?'Kết quả':'Hoàn thành'):'Tiếp ›')+'</button></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);save();
}
function choose(j){
  if(S.sub)return;const k=order()[S.pos];
  if(S.mode==='practice'&&S.ans[k]!=null)return;
  S.ans[k]=j;renderQ();
  if(S.mode==='practice')setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30);
}
function go(d){const n=order().length;S.pos=Math.max(0,Math.min(n-1,S.pos+d));renderQ()}
function openSheet(){
  closeSheet();
  const ord=order(),cur=ord[S.pos];
  let nums='';
  X.qs.forEach((q,k)=>{
    const a=S.ans[k];let c='';
    if(a!=null){c=(S.sub||S.mode==='practice')?(a===q.a?'ok':'bad'):'sel'}
    if(k===cur)c+=' cur';
    nums+='<button class="'+c+'" onclick="jump('+k+')">'+(k+1)+'</button>';
  });
  const un=X.qs.length-cnt(S);
  const d=document.createElement('div');d.className='ov';d.id='sheet';
  d.onclick=e=>{if(e.target===d)closeSheet()};
  d.innerHTML='<div class="sheet"><h3>Danh sách câu · đã làm '+cnt(S)+'/'+X.qs.length+'</h3><div class="mut">'+(S.sub||S.mode==='practice'?'Xanh = đúng, đỏ = sai':'Xanh dương = đã chọn')+'</div><div class="nums">'+nums+'</div><div class="row">'
   +(S.sub?'<button class="nb p" onclick="res()">Xem kết quả</button>':'<button class="nb p" onclick="submitQ()">Nộp bài'+(un?' ('+un+' câu trống)':'')+'</button>')
   +'<button class="nb" onclick="restart()">Làm lại từ đầu</button><button class="nb" onclick="closeSheet()">Đóng</button></div></div>';
  document.body.appendChild(d);
}
function closeSheet(){const d=document.getElementById('sheet');if(d)d.remove()}
function jump(k){S.filter=false;S.pos=k;renderQ()}
function ask(msg,yes,label){
  const old=document.getElementById('dlg');if(old)old.remove();
  const d=document.createElement('div');d.className='ov';d.id='dlg';d.style.zIndex=30;d.style.alignItems='center';
  d.innerHTML='<div class="sheet" style="border-radius:16px;max-width:340px;margin:0 16px;padding:18px"><div style="margin-bottom:14px">'+esc(msg)+'</div><div class="row"><button class="nb" id="dno">Hủy</button><button class="nb p" id="dyes">'+esc(label||'Đồng ý')+'</button></div></div>';
  document.body.appendChild(d);
  document.getElementById('dno').onclick=()=>d.remove();
  document.getElementById('dyes').onclick=()=>{d.remove();yes()};
}
function submitQ(){
  const un=X.qs.length-cnt(S);
  if(un)ask('Còn '+un+' câu chưa làm. Vẫn nộp bài?',doSubmit,'Nộp bài');else doSubmit();
}
function doSubmit(){
  S.sub=true;S.filter=false;S.pos=0;
  const sc=scoreOf(X,S),b=LS.get('best_'+X.id);if(b==null||sc>b)LS.set('best_'+X.id,sc);
  save();res();
}
function restart(){
  ask('Xóa bài đã làm của đề này và làm lại từ đầu?',()=>{LS.del('st_'+X.id);S=fresh();renderQ()},'Làm lại');
}
function res(){
  view='res';closeSheet();
  const sc=scoreOf(X,S),tot=X.qs.length,w=[];
  X.qs.forEach((q,k)=>{if(S.ans[k]!==q.a)w.push(k)});
  let h='<div class="top"><div class="r"><button class="ib" onclick="home()" aria-label="Về danh sách">←</button><div class="ttl">'+esc(X.name)+' · Kết quả</div></div><div class="pb"></div></div>';
  h+='<div class="wrap"><div class="box"><div class="mut">Kết quả</div><div class="score">'+sc+'/'+tot+'</div><div>'+(sc/tot*10).toFixed(1)+' điểm · sai '+(tot-sc)+' câu</div></div>';
  h+='<div class="row">'+(w.length?'<button class="nb p" onclick="review(true)">Xem lại câu sai ('+w.length+')</button>':'')+'<button class="nb'+(w.length?'':' p')+'" onclick="review(false)">Xem lại tất cả</button><button class="nb" onclick="again()">Làm lại đề này</button><button class="nb" onclick="home()">Danh sách đề</button></div>';
  if(w.length){h+='<h2>Các câu sai (bấm để xem)</h2><div class="nums">'+w.map(k=>'<button class="bad" onclick="jump('+k+')">'+(k+1)+'</button>').join('')+'</div>'}
  app.innerHTML=h+'</div>';window.scrollTo(0,0);
}
function review(f){S.filter=f;S.pos=0;renderQ()}
function again(){LS.del('st_'+X.id);S=fresh();renderQ()}
// swipe + keyboard
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(view!=='q'||document.getElementById('sheet'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dy)<45){const n=order().length;if(dx<0&&S.pos<n-1)go(1);else if(dx>0&&S.pos>0)go(-1)}
},{passive:true});
document.addEventListener('keydown',e=>{
  if(view!=='q'||document.getElementById('sheet'))return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else{const j='abcd1234'.indexOf(e.key.toLowerCase());if(j>=0)choose(j%4)}
});
home();
</script>
</body>
</html>
